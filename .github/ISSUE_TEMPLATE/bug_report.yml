name: Bug report
description: Report incorrect behavior or a PHP 5.3 compatibility problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal PHP reproducer
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected PHP 5.3 behavior
      description: Include the reference PHP 5.3 output when available.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security-sensitive?
      description: If yes, stop and use private vulnerability reporting instead.
      options: ["No", "Yes"]
    validations:
      required: true
